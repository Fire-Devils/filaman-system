name: Release (Docker + GitHub Release)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.2.48"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          set -eu
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from git log (Conventional Commits)
        id: notes
        shell: bash
        run: |
          set -eu
          TAG="${{ steps.version.outputs.tag }}"

          # letzten Tag finden (falls keiner existiert: erstes Commit)
          PREV_TAG="$(git tag --sort=-creatordate \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -n 1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            FIRST="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            RANGE="${FIRST}..HEAD"
          fi

          echo "Using range: $RANGE"

          # Hilfsfunktion: Kategorie ausgeben + Version-Bump rausfiltern
          list_cat () {
            local pattern="$1"
            git log "$RANGE" --pretty=format:"- %s (%an, %h)" \
              | grep -E "$pattern" \
              | grep -v -E '^- chore: bump version to ' \
              || true
          }

          {
            echo "## Artefakte"
            echo ""
            echo "- Docker: \`ghcr.io/fire-devils/filaman-system:$TAG\`"
            echo "- Docker: \`ghcr.io/fire-devils/filaman-system:latest\`"
            echo ""

            echo "## Änderungen"
            echo ""

            echo "### Features"
            list_cat '^- feat(\(.+\))?: '
            echo ""

            echo "### Fixes"
            list_cat '^- fix(\(.+\))?: '
            echo ""

            echo "### Chore/Refactor/Deps"
            list_cat '^- (chore|refactor|perf|build|ci|deps)(\(.+\))?: '
            echo ""

            echo "### Dokumentation/Tests"
            list_cat '^- (docs|test)(\(.+\))?: '
            echo ""

            # Sonstiges: alles, was keinem Conventional-Commit-Präfix entspricht
            # (fängt nicht-konforme Commit-Messages ab, damit keine Änderungen verloren gehen)
            echo "### Sonstiges"
            git log "$RANGE" --no-merges --pretty=format:"- %s (%an, %h)" \
              | grep -v -E '^- (feat|fix|chore|refactor|perf|build|ci|deps|docs|test)(\(.+\))?: ' \
              | grep -v -E '^- (chore: bump version to |Bump version to )' \
              || true
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "**Full diff:** https://github.com/Fire-Devils/filaman-system/compare/${PREV_TAG}...${TAG}"
            fi
          } > RELEASE_NOTES.md

          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          draft: false
          prerelease: false

      - name: Generate production .env file
        run: |
          echo "DEBUG=false" > .env
          echo "CORS_ORIGINS=*" >> .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo "CSRF_SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo "OIDC_ENC_KEY=$(openssl rand -hex 32)" >> .env
          echo "DATABASE_URL=sqlite+aiosqlite:////app/data/filaman.db" >> .env
          echo "ADMIN_EMAIL=admin@example.com" >> .env
          echo "ADMIN_PASSWORD=admin123" >> .env
          echo "ADMIN_DISPLAY_NAME=Admin" >> .env
          echo "ADMIN_LANGUAGE=en" >> .env
          echo "ADMIN_SUPERADMIN=true" >> .env
          echo "Generated .env file for build:"
          cat .env

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ghcr.io/fire-devils/filaman-system:latest
            ghcr.io/fire-devils/filaman-system:${{ steps.version.outputs.tag }}
            ghcr.io/fire-devils/filaman-system:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_NAME: Release ${{ steps.version.outputs.tag }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping Discord notification"
            exit 0
          fi
          payload=$(jq -n \
            --arg content "Neuer Release in **$REPO**: **$RELEASE_NAME** (\`$RELEASE_TAG\`) \n$RELEASE_URL" \
            '{content: $content}')
          curl -fsS -H "Content-Type: application/json" \
               -d "$payload" \
               "$DISCORD_WEBHOOK_URL"
