name: Frontend plugin themes

# Required check on devel: runs for every pull request (no path filter),
# otherwise PRs without frontend changes would wait for it forever.
on:
  pull_request:
  push:
    branches: [devel]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-plugin-themes.yml'

jobs:
  plugin-themes:
    # Keep plugin compatibility checks independent of the label-editor suite.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run dev -- --host 127.0.0.1 > /tmp/filaman-astro.log 2>&1 &
      - name: Wait for Astro
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4321/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/filaman-astro.log
          exit 1
      - run: node scripts/check-filament-plugin-hooks.mjs
        env:
          CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
