name: Frontend typecheck

# Required check on devel: runs for every pull request (no path filter),
# otherwise PRs without frontend changes would wait for it forever.
on:
  pull_request:
  push:
    branches: [devel]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-typecheck.yml'

jobs:
  typecheck:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
